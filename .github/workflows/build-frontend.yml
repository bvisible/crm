name: build-frontend

on:
  push:
    branches: [version-15]
    paths:
      - 'frontend/**'
      - '!**/node_modules/**'
      - '!crm/public/frontend/**'
      - '!crm/www/crm.html'

permissions:
  contents: write

concurrency:
  group: build-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      # //// Neoffice — upstream's frontend/package.json links `@framework/ui` to a sibling
      # //// frappe checkout (link:../../frappe/ui, aliased in vite.config.js), a package
      # //// that only frappe version-16 carries. The same step as upstream's
      # //// frontend-tests.yml puts it next to the workspace: only `ui`, at the latest
      # //// version-16 release. The bundle is built once here and runs on v15 and v16.
      # //// Node 24 like upstream's frontend job (was 20).
      - name: Clone frappe for @framework/ui
        run: |
          git clone --depth 1 --branch "$(bash .github/helper/frappe_ref.sh version-16)" --filter=blob:none --sparse \
            https://github.com/frappe/frappe "$GITHUB_WORKSPACE/../frappe"
          git -C "$GITHUB_WORKSPACE/../frappe" sparse-checkout set ui

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install
        run: cd frontend && yarn install --frozen-lockfile

      - name: Build
        run: cd frontend && yarn build

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crm/public/frontend crm/www/crm.html
          if git diff --cached --quiet; then
            echo "No artifact changes to commit"
            exit 0
          fi
          git commit --no-verify -m "[skip-build] frontend artifacts for ${GITHUB_SHA::8}"
          git push
