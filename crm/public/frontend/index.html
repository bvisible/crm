    <!-- //// Neoffice — commit-the-build: upstream gitignores the vite output and
    //// rebuilds it on every instance; we commit crm/public/frontend/ and
    //// crm/www/crm.html (this file, copied from the build by yarn copy-html-entry)
    //// so no client VM ever runs yarn. The marker is written in
    //// frontend/index.html so a rebuild keeps it in the copies — never hand-edit
    //// the copies. Commits d7c4209b and f5abf846. -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover maximum-scale=1.0, user-scalable=no"
    />
    <title>Frappe CRM</title>
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- //// Neoffice — upstream's apple-mobile-web-app-title (« Frappe CRM ») removed: the template below writes the name. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="white" />

    <!-- PWA -->
    <!-- //// Neoffice — upstream lists here the icons and the launch images of its own brand.
         //// neoffice_theme writes ours: one template for every application put on a phone's home screen
         //// (neoffice_theme/home_screen.py). « ignore missing »: without the theme, the page opens with no icon.
         //// At a merge, upstream's block stays out. -->
    {% set neo_home_screen_app = "crm" %}
    {% include "neoffice_theme/templates/includes/home_screen_head.html" ignore missing %}
    <!-- //// Neoffice — the accent of frappe-ui (its blue scale) is repainted with the Neoffice signal by one sheet
         //// that neoffice_theme serves to every Vue app. It replaces the block each app copied into src/index.css,
         //// which set RGB triplets where frappe-ui reads colours and so never applied (measured 23.11.2026).
         //// A script and not a <link>: the build would try to resolve a sheet another app serves. -->
    <script>
      (function () {
        var l = document.createElement("link");
        l.rel = "stylesheet";
        l.href = "/assets/neoffice_theme/css/spa_accent.css";
        document.head.appendChild(l);
      })();
    </script>
